name: Deploy YaariGo Frontend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            echo "Navigating to project..."
            cd /var/www/yaarigo/yaarigo-fe

            echo "Fetching latest code..."
            git fetch origin develop
            git reset --hard origin/develop
            git clean -fd

            echo "Updating environment variables (.env.production) safely..."
            TMP_FILE=$(mktemp)

            cat > $TMP_FILE <<EOL
            NODE_ENV=production
            NEXT_PUBLIC_USER_SERVICE_URL=${{ secrets.NEXT_PUBLIC_USER_SERVICE_URL }}
            NEXT_PUBLIC_AUTH_SERVICE_URL=${{ secrets.NEXT_PUBLIC_AUTH_SERVICE_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            EOL

            sudo mv $TMP_FILE /var/www/yaarigo/yaarigo-fe/.env.production
            sudo chown devops:devops /var/www/yaarigo/yaarigo-fe/.env.production
            sudo chmod 600 /var/www/yaarigo/yaarigo-fe/.env.production

            echo "Installing dependencies..."
            npm ci || npm install

            echo "Building NextJS..."
            npm run build

            echo "Reloading PM2 process..."
            pm2 reload yaarigo-dev-web --update-env || pm2 start npm --name "yaarigo-dev-web" -- start --env production

            echo "Saving PM2 state..."
            pm2 save

            echo "Deployment completed successfully"
